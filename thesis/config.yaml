#    «قالب_و_شیوه‌نامه_ی_نگارش_امیرکبیر.pdf» در ریشه‌ی مخزن).
#    ارجاع‌های داخل کامنت‌ها به شماره‌ی بخش همان شیوه‌نامه است.
# =====================================================================

